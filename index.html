<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Arena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="hud">
        <div class="score-panel left">
          <span class="label">Steve</span>
          <span id="leftScore">0</span>
        </div>
        <div class="center-panel">
          <div id="dimensionName">Overworld</div>
          <div class="mini-legend">Arrow Keys / Mouse = Move</div>
        </div>
        <div class="score-panel right">
          <span id="rightScore">0</span>
          <span class="label">Mobs</span>
        </div>
      </header>

      <canvas id="gameCanvas" width="960" height="540" aria-label="Minecraft paddle game"></canvas>
    </div>

    <script src="script.js"></script>
  </body>
</html>
